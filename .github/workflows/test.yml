name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq

      - name: Syntax check
        run: zsh -n session-manager.zsh install.sh uninstall.sh tests/*.zsh

      - name: Installer and uninstaller smoke test
        run: zsh tests/install-uninstall.zsh

      - name: Scrollback snapshot test
        run: zsh tests/snapshot-scrollback.zsh

      - name: Restore id-map test
        run: zsh tests/restore-id-map.zsh

      - name: Release control test
        run: zsh tests/release-control.zsh

      - name: Validate package metadata
        run: jq . package.json
