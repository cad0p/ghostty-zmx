name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/from-v') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure jq
        run: command -v jq || brew install jq

      - name: Run tests
        run: zsh tests/ci.zsh
